name: Build theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Package theme
        run: |
          mkdir -p dist/ashish-web-studio-sage
          rsync -a ./ dist/ashish-web-studio-sage/ \
            --exclude .git --exclude .github --exclude node_modules --exclude dist \
            --exclude '.editorconfig' --exclude '.gitattributes' --exclude '.gitignore' \
            --exclude package-lock.json --exclude vite.config.js
          cd dist && zip -qr ashish-web-studio-sage.zip ashish-web-studio-sage

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/ashish-web-studio-sage.zip \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA}. Install this zip in WordPress under Appearance > Themes." \
            --target "${GITHUB_SHA}"
